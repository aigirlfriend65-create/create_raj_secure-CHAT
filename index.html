<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Chat - PWA Messenger</title>
    
    <!-- PWA Manifest & Theme Color -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0f19">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        neonCyan: '#00f0ff',
                        darkCard: '#131b2e'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        /* Custom Neon Glow Effect */
        .neon-border {
            border: 1px solid rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
        }
        .neon-glow {
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-darkCard border-b border-cyan-500/20 px-4 py-3 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <img src="icon.png" alt="Logo" class="w-10 h-10 rounded-lg neon-border object-cover">
            <h1 class="text-xl font-bold text-neonCyan neon-glow tracking-wider">[SECRET CHAT]</h1>
        </div>
        <div class="flex items-center space-x-2">
            <span class="inline-block w-3 h-3 bg-green-500 rounded-full animate-pulse"></span>
            <span class="text-xs text-gray-400">Online</span>
        </div>
    </header>

    <!-- Chat Container -->
    <main class="flex-1 max-w-2xl w-full mx-auto p-4 flex flex-col justify-between">
        <!-- Messages Area -->
        <div id="chat-box" class="space-y-4 mb-4 overflow-y-auto flex-1 pr-2">
            <div class="flex justify-start">
                <div class="bg-darkCard neon-border p-3 rounded-2xl rounded-tl-none max-w-[80%] text-sm">
                    <p class="text-neonCyan font-semibold mb-1">System</p>
                    <p>স্বাগতম! সিক্রেট চ্যাটে এন্ড-টু-এন্ড এনক্রিপ্টেড মেসেজিং শুরু করুন।</p>
                    <span class="text-[10px] text-gray-500 mt-1 block">Just now</span>
                </div>
            </div>
        </div>

        <!-- Input Form -->
        <form id="chat-form" class="flex items-center gap-2 bg-darkCard p-2 rounded-xl neon-border">
            <input type="text" id="message-input" placeholder="আপনার সিক্রেট মেসেজ লিখুন..." 
                class="flex-1 bg-transparent border-none outline-none px-3 text-sm text-white placeholder-gray-500">
            <button type="submit" class="bg-cyan-500/10 hover:bg-cyan-500/20 text-neonCyan border border-cyan-500/40 px-5 py-2 rounded-lg font-medium text-sm transition-all duration-200">
                Send
            </button>
        </form>
    </main>

    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker Registered!', reg))
                    .catch(err => console.log('Service Worker Failed!', err));
            });
        }

        // Simple Chat Frontend Logic
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const chatBox = document.getElementById('chat-box');

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if(!text) return;

            // Append User Message
            const msgDiv = document.createElement('div');
            msgDiv.className = 'flex justify-end';
            msgDiv.innerHTML = `
                <div class="bg-cyan-950/40 border border-cyan-500/30 p-3 rounded-2xl rounded-tr-none max-w-[80%] text-sm">
                    <p class="text-white">${escapeHtml(text)}</p>
                    <span class="text-[10px] text-gray-400 mt-1 block text-right">Just now</span>
                </div>
            `;
            chatBox.appendChild(msgDiv);
            messageInput.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        function escapeHtml(string) {
            return String(string).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
